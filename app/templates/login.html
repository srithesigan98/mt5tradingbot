<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trading Journal — Log in</title>
  <style>
    :root { --bg:#f6f4fd; --surface:#fff; --border:#e7e2f6; --ink:#201c3a; --ink-2:#5b5680; --muted:#928db3; --purple:#6c4cf1; --purple-dark:#2b2467; --bad:#c0392b; --bad-bg:#fdeaec; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      display:grid; place-items:center; padding:24px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:18px;
      padding:28px 26px; width:100%; max-width:380px; box-shadow:0 10px 40px rgba(60,40,140,.08); }
    .logo { width:46px; height:46px; border-radius:13px; background:var(--purple-dark);
      display:grid; place-items:center; font-size:22px; color:#fff; margin:0 auto 14px; }
    h1 { font-size:20px; text-align:center; margin:0 0 4px; }
    .sub { text-align:center; color:var(--muted); font-size:13px; margin-bottom:20px; }
    label { display:block; font-size:12px; font-weight:700; color:var(--ink-2); text-transform:uppercase; letter-spacing:.04em; margin:0 0 6px; }
    input { width:100%; border:1px solid var(--border); border-radius:11px; padding:12px 13px; font-size:15px; margin-bottom:16px; background:#fff; color:var(--ink); }
    input:focus { outline:none; border-color:var(--purple); }
    button { width:100%; border:none; border-radius:11px; padding:13px; font-size:15px; font-weight:700; color:#fff; cursor:pointer; background:linear-gradient(135deg,#3a2a8f,#6c4cf1); }
    .err { background:var(--bad-bg); color:var(--bad); border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:16px; text-align:center; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <div class="logo">📈</div>
    <h1>Trading Journal</h1>
    <div class="sub">Log in to your journal</div>
    {% if error %}<div class="err">Incorrect username or password.</div>{% endif %}
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autofocus required />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button type="submit">Log in</button>
  </form>
</body>
</html>
