# Render Blueprint — deploys the trading-journal bot + dashboard as one web service.
# In Render: New + -> Blueprint -> connect this repo. Then fill in the env vars
# marked `sync: false` in the dashboard (they are your secrets).
services:
  - type: web
    name: trading-journal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: UTC_OFFSET_HOURS
        value: "8"
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: ALLOWED_TELEGRAM_USER_IDS
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"
